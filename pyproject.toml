    "gymnasium>=1.0.0",
    "numpy>=2.0.0",
    "rich>=13.9.0",
    "sb3-contrib>=2.4.0",
    "stable-baselines3>=2.4.0",
    "tensorboard>=2.18.0",
    "torch>=2.4.0",
    "tqdm>=4.67.0",
]
